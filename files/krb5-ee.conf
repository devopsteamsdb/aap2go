# Kerberos client defaults for the execution environment, installed as
# /etc/krb5.conf.d/ee.conf (picked up through "includedir /etc/krb5.conf.d/"
# in the stock /etc/krb5.conf and taking precedence over its [libdefaults]).
#
# - a FILE credential cache: the default KEYRING cache does not work in containers
# - KDCs are discovered through DNS SRV records (works for Active Directory)
#
# Realm specific settings ([realms], [domain_realm], default_realm) are not
# baked into the image: either rely on DNS discovery, mount /etc/krb5.conf from
# the host (AAP: "Paths to expose to isolated jobs"), or add a COPY step for a
# customised copy of files/krb5.conf.example in execution-environment.yml.
[libdefaults]
    default_ccache_name = FILE:/tmp/krb5cc_%{uid}
    dns_lookup_kdc = true
    dns_lookup_realm = false
    dns_canonicalize_hostname = false
    rdns = false
    forwardable = true
    ticket_lifetime = 24h
    renew_lifetime = 7d
